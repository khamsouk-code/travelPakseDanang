<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ທ່ຽວຫວຽດນາມ</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* book */
.book {
  width: 90vw;
  height: 90vh;
  perspective: 2000px;
  position: relative;
}

/* page */
.page {
  width: 100%;
  height: 100%;
  position: absolute;
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-sizing: border-box;
  backface-visibility: hidden;
  transform-origin: left;
  transition: transform 0.8s ease;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  overflow-y: auto;
}

/* flipped */
.page.flipped {
  transform: rotateY(-180deg);
}

/* text style */
h1, h2 {
  color: #333;
}

img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="book" id="book">

  <div class="page">
    <h1>ທ່ຽວຫວຽດນາມ</h1>
    <p>5 ວັນ 4 ຄືນ</p>
  </div>

  <div class="page">
    <h2>ມື້ 1</h2>
    <p>ເດີນທາງ</p>
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
  </div>

  <div class="page">
    <h2>ມື້ 2</h2>
    <p>Ba Na Hills</p>
  </div>

  <div class="page">
    <h2>ມື້ 3</h2>
    <p>Hoi An</p>
  </div>

</div>

<audio id="flipSound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let pages = document.querySelectorAll(".page");
let current = 0;
let startX = 0;

// swipe
document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (startX - endX > 50) flipNext();
  if (endX - startX > 50) flipPrev();
});

// flip next
function flipNext() {
  if (current >= pages.length) return;
  pages[current].classList.add("flipped");
  playSound();
  current++;
}

// flip prev
function flipPrev() {
  if (current <= 0) return;
  current--;
  pages[current].classList.remove("flipped");
  playSound();
}

// sound
function playSound() {
  let audio = document.getElementById("flipSound");
  audio.currentTime = 0;
  audio.play();
}
</script>

</body>
</html>
