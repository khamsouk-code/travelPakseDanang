<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khamsouk Trip</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body, html {
            height: 100%;
        }

        .hero {
            height: 100vh;
            background: url('1day.png') no-repeat center center/cover;
            position: relative;
        }

        .overlay {
            position: relative;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .content {
            background: rgba(0,0,0,0.4);
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            
            width: 80%;
            max-width: 300px;

            padding: 15px;
            font-size: 18px;
            text-align: center;

            background: #ff7a00;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #ff5500;
        }

        .btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* ทำให้สวยขึ้นบนมือถือ */
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="hero">
        <div class="overlay">
            <div class="content">
                <h1>Khamsouk Trip Laos-Vietnam</h1>
            </div>

            <a href="day1.html" class="btn">ກົດເບີ່ງມື້ແລກ</a>
        </div>
    </div>

</body>
</html>
