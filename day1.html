<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Day Trip - Khamsouk Travel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        body {
            /* แก้ไขตรงนี้เพื่อใช้พื้นหลังบน GitHub */
            background: #2c3e50 url('./bg1day.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: white;
        }

        .header { text-align: center; padding: 30px; }
        .header h1 { background: rgba(0,0,0,0.7); display: inline-block; padding: 15px 25px; border-radius: 15px; }

        .timeline { width: 90%; max-width: 600px; margin: auto; }
        .item { background: rgba(0,0,0,0.7); margin-bottom: 20px; padding: 20px; border-radius: 15px; }
        .item h2 { color: #ffd27a; margin-bottom: 10px; }
        .item img { width: 100%; border-radius: 10px; margin-top: 10px; display: block; }

        .btn-area { text-align: center; padding: 40px; }
        .btn { background: #ff7a00; color: white; padding: 15px 30px; text-decoration: none; border-radius: 30px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ONE DAY TRIP</h1>
    </div>

    <div class="timeline">
        <div class="item">
            <h2>04:00 ໂມງ</h2>
            <p>ອອກເດີນທາງຈາກປາກເຊໄປດານິງ</p>
            <img src="./one1day.png">
        </div>

        <div class="item">
            <h2>12:00 ໂມງ</h2>
            <p>ຮອດຊາຍແດນ ກິນເຂົ້າຮ່ວມສາມັກຄີຢູ່ດ່ານ</p>
            <img src="./two1day.png">
        </div>

        <div class="item">
            <h2>16:00 ໂມງ</h2>
            <p>ຮອດດານິງ ກຽມເຄື່ອງອາບນໍ້າ</p>
            <img src="./three1day.png">
        </div>

        <div class="item">
            <h2>19:00 ໂມງ</h2>
            <p>ຮັບປະທานອາຫານຮ່ວມກັນ</p>
            <img src="./four1day.png">
        </div>
    </div>

    <div class="btn-area">
        <a href="day2.html" class="btn">ກົດເບີ່ງມື້ທີ່ສອງ</a>
    </div>

</body>
</html>
